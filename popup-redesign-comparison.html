<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Redesign Comparison</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #f4f6f8; }
    header { padding: 16px 20px; background: #0d1b2a; color: #fff; }
    h1 { margin: 0; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
    .card { background: #fff; border: 1px solid #e1e5e9; border-radius: 10px; overflow: hidden; }
    .card header { background: #f6f8fa; color: #111; border-bottom: 1px solid #e1e5e9; padding: 10px 12px; }
    .meta { color: #555; font-size: 12px; }
    iframe { width: 100%; height: 720px; border: 0; background: #fff; }
    .note { padding: 8px 12px; font-size: 13px; color: #444; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
  </style>
  <script>
    function setSrcs() {
      document.getElementById('v1').src = 'http://localhost:8101/options/options.html';
      document.getElementById('v2').src = 'http://localhost:8102/options/options.html';
      document.getElementById('v3').src = 'http://localhost:8103/options/options.html';
    }
    window.addEventListener('DOMContentLoaded', setSrcs);
  </script>
  </head>
<body>
  <header>
    <h1>Smart TOC – Popup Redesign Comparison</h1>
    <div class="meta">Preview v1/v2/v3 side-by-side at ports 8101–8103</div>
  </header>
  <div class="note">
    Start servers via <code>./run-popup-redesign.sh all</code>, then refresh this page.
  </div>
  <section class="grid">
    <div class="card">
      <header>Version 1 – Friendly Pills</header>
      <iframe id="v1"></iframe>
    </div>
    <div class="card">
      <header>Version 2 – Sidebar Navigation</header>
      <iframe id="v2"></iframe>
    </div>
    <div class="card">
      <header>Version 3 – Tabs + Segmented</header>
      <iframe id="v3"></iframe>
    </div>
  </section>
</body>
</html>
