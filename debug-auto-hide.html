<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動隱藏功能調試</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 40px;
            background: #f0f2f5;
            color: #333;
        }
        
        .debug-panel {
            background: white;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .status {
            font-family: 'Monaco', 'Menlo', monospace;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            text-align: center;
            padding: 20px;
            background: #fff5f5;
            border-radius: 10px;
            border: 2px dashed #e74c3c;
        }
        
        h1 { color: #2c3e50; }
        h2 { color: #27ae60; }
        h3 { color: #8e44ad; }
        h4 { color: #e67e22; }
        h5 { color: #34495e; }
    </style>
</head>
<body>
    <div class="debug-panel">
        <h1>🔍 自動隱藏功能調試頁面</h1>
        <p><strong>這個頁面專門用來調試自動隱藏功能。</strong></p>
        
        <div class="timer" id="timer">
            載入時間: <span id="seconds">0</span> 秒
        </div>
        
        <div class="status" id="status">
            📋 調試狀態將顯示在這裡...
        </div>
    </div>

    <h1>測試內容區域</h1>
    <p>這裡是一些測試內容，確保有足夠的標題來觸發自動展示功能。</p>
    
    <h2>第一個主要標題</h2>
    <p>這是第一個主要標題下的內容。</p>
    
    <h3>第一個子標題</h3>
    <p>這是第一個子標題的內容。</p>
    
    <h4>更深層的標題</h4>
    <p>這是更深層標題的內容。</p>
    
    <h2>第二個主要標題</h2>
    <p>這是第二個主要標題下的內容。</p>
    
    <h3>第二個子標題</h3>
    <p>這是第二個子標題的內容。</p>
    
    <h5>更多標題內容</h5>
    <p>確保有足夠的標題來觸發自動展示功能。</p>

    <script>
        let startTime = Date.now();
        let timer = document.getElementById('seconds');
        let status = document.getElementById('status');
        let logMessages = [];
        
        // 更新計時器
        setInterval(() => {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            timer.textContent = elapsed;
        }, 100);
        
        // 攔截 console.log 來顯示調試信息
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            
            const message = args.join(' ');
            const timestamp = Math.floor((Date.now() - startTime) / 1000);
            logMessages.push(`[${timestamp}s] ${message}`);
            
            // 只顯示最近的10條消息
            if (logMessages.length > 10) {
                logMessages = logMessages.slice(-10);
            }
            
            status.innerHTML = logMessages.join('<br>');
        };
        
        // 監控 TOC 狀態
        function checkTocStatus() {
            const tocPanel = document.querySelector('.eagle-toc-panel');
            if (tocPanel) {
                const isVisible = tocPanel.style.display !== 'none' && 
                                 tocPanel.offsetParent !== null;
                console.log(`🎯 TOC Panel Status: ${isVisible ? 'VISIBLE' : 'HIDDEN'}`);
            } else {
                console.log('❌ TOC Panel not found');
            }
        }
        
        // 每秒檢查一次狀態
        setInterval(checkTocStatus, 1000);
        
        console.log('🚀 調試頁面已載入');
        console.log('⏰ 預期: 1秒後TOC出現，4秒後消失');
        
        // 5秒後進行最終檢查
        setTimeout(() => {
            console.log('🏁 5秒測試完成 - 檢查結果');
            checkTocStatus();
        }, 5000);
    </script>

    <!-- 載入 Smart TOC -->
    <link rel="stylesheet" href="content/content.css">
    <script src="content/content.js"></script>
</body>
</html>
