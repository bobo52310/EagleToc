<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PingFang TC"; src: local("PingFang TC"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070d2b;
      }

      :root {
        --sky-950: #070d2b;
        --sky-900: #0f1a4f;
        --brand-navy: #0a3a6e;
        --brand-cyan: #2196f3;
        --brand-sky: #38b6ff;
        --ink-50: #f2f6ff;
        --ink-300: #b9c7e6;
        --sans: "Noto Sans TC", "Inter", "PingFang TC", system-ui, sans-serif;
      }

      body { font-family: var(--sans); color: var(--ink-50); }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--sky-950);
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      .hl {
        background: linear-gradient(120deg, #7cc4ff 0%, #38b6ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .pill {
        position: absolute;
        left: 80px;
        bottom: 72px;
        padding: 18px 44px;
        border-radius: 999px;
        font-size: 56px;
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
        color: var(--ink-50);
        background: var(--sky-900);
        border: 2px solid rgba(124, 196, 255, 0.45);
        box-shadow: 0 18px 50px rgba(7, 13, 43, 0.55);
      }

      /* ================= WORLD: one continuous shot from S1 into S2, reused in S5 ================= */
      #sky { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
      #horizon-glow {
        position: absolute;
        left: 0; top: 196px;
        width: 1920px; height: 400px;
        opacity: 0;
        background: radial-gradient(ellipse 620px 170px at 50% 50%, #3f7fd0 0%, rgba(63, 127, 208, 0.62) 32%, rgba(56, 182, 255, 0.12) 70%, rgba(56, 182, 255, 0) 100%);
      }
      #persp {
        position: absolute;
        inset: 0;
        perspective: 1500px;
        perspective-origin: 960px 780px;
      }
      #road {
        position: absolute;
        left: 960px;
        top: 0;
        width: 1280px;
        transform-origin: 0 0;
        transform-style: preserve-3d;
        --tilt: 0;
        --s: 3.2;
        --py: 240;
        --ty: 540;
        --ax: 738;
        transform:
          translate3d(0, calc(var(--ty) * 1px), 0)
          rotateX(calc(var(--tilt) * 1deg))
          scale3d(var(--s), var(--s), var(--s))
          translate(calc(var(--ax) * -1px), calc(var(--py) * -1px));
      }
      /* Road grade: white page → deep navy, ink → glowing ice blue. Colour only. */
      .slice {
        position: absolute;
        left: 0;
        width: 1280px;
        display: block;
        filter: url(#road-grade);
        clip-path: inset(0 4px 0 200px);
      }
      .edge {
        position: absolute;
        top: 0;
        width: 120px;
        height: 100%;
        opacity: 0;
        background: linear-gradient(90deg, rgba(56, 182, 255, 0), rgba(124, 196, 255, 0.9) 46%, rgba(235, 246, 255, 1) 50%, rgba(124, 196, 255, 0.9) 54%, rgba(56, 182, 255, 0));
      }
      .edge.l { left: 140px; }
      .edge.r { left: 1216px; }
      .dot {
        position: absolute;
        width: 84px; height: 84px;
        margin: -42px 0 0 -42px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle, #f2f9ff 0%, #9fd6ff 26%, rgba(56, 182, 255, 0.45) 46%, rgba(56, 182, 255, 0) 72%);
      }
      /* Fog sits on the road plane, above surface/edges/dots and below the signs. */
      .road-fog {
        position: absolute;
        left: 150px; top: 0;
        width: 1176px; height: 9000px;
        opacity: 0;
        background: linear-gradient(to bottom, #3f7fd0 0%, #3f7fd0 5%, rgba(40, 84, 160, 0.92) 24%, rgba(24, 52, 120, 0) 100%);
      }
      #road-signs { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
      .sign { position: absolute; width: 0; height: 0; transform-style: preserve-3d; }
      .sign-tilt {
        position: absolute;
        left: 0; top: 0;
        width: 0; height: 0;
        transform-origin: 0 0;
        transform: rotateX(calc(var(--tilt) * -1deg)) scale(var(--ss));
      }
      .sign-body { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transform-origin: 0 0; }
      .pole {
        position: absolute;
        left: -2px; bottom: 0;
        width: 4px;
        height: var(--pole);
        background: linear-gradient(to top, rgba(124, 196, 255, 0.25), #9fd6ff);
      }
      .sign-label {
        position: absolute;
        bottom: var(--pole);
        white-space: nowrap;
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        padding: 14px 26px;
        border-radius: 14px;
        color: var(--ink-50);
        background: var(--sky-900);
        border: 3px solid var(--brand-sky);
        box-shadow: 0 0 34px rgba(56, 182, 255, 0.55);
      }
      .sign.left .sign-label { right: -2px; }
      .sign.right .sign-label { left: -2px; }

      #dim { position: absolute; inset: 0; background: var(--sky-950); opacity: 0.8; }

      #eagle-light {
        position: absolute;
        left: 460px; top: -130px;
        width: 1000px; height: 260px;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(159, 214, 255, 0.7) 0%, rgba(56, 182, 255, 0.28) 42%, rgba(56, 182, 255, 0) 72%);
      }
      #eagle-fly {
        position: absolute;
        left: 181px; top: -299px;
        width: 1558px; height: 598px;
        opacity: 0;
      }
      #eagle { display: block; width: 1558px; height: 598px; transform-origin: 50% 50%; }

      /* ================= SCROLLBAR: S1 and S5 share it ================= */
      #scrollbar { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
      #track-ticks { opacity: 0; }
      #here-dot {
        position: absolute;
        width: 44px; height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle, #ffffff 0%, #9fd6ff 38%, #38b6ff 60%, rgba(56, 182, 255, 0) 74%);
        box-shadow: 0 0 44px 12px rgba(56, 182, 255, 0.6);
      }
      .here-ring {
        position: absolute;
        width: 44px; height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 3px solid #9fd6ff;
        opacity: 0;
      }

      /* ================= S1 ================= */
      #hook-copy {
        position: absolute;
        left: 130px; top: 310px;
        font-size: 184px;
        font-weight: 900;
        line-height: 1.26;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      #hook-copy div { opacity: 0; }

      /* ================= S2 ================= */
      #hud {
        position: absolute;
        left: 56px; top: 226px;
        width: 276px; height: 400px;
        overflow: hidden;
        opacity: 0;
        border-radius: 22px;
        background: rgba(15, 26, 79, 0.84);
        border: 2px solid rgba(124, 196, 255, 0.4);
      }
      #hud-ticks {
        position: absolute;
        left: 0; top: -3200px;
        width: 72px; height: 3800px;
        background:
          repeating-linear-gradient(to bottom, #b9c7e6 0 3px, transparent 3px 120px) left top / 60px 100% no-repeat,
          repeating-linear-gradient(to bottom, rgba(185, 199, 230, 0.6) 0 2px, transparent 2px 24px) left top / 30px 100% no-repeat;
      }
      #hud-needle {
        position: absolute;
        left: 0; top: 184px;
        width: 72px; height: 4px;
        background: var(--brand-sky);
        box-shadow: 0 0 14px var(--brand-sky);
      }
      #alt-num {
        position: absolute;
        left: 84px; top: 150px;
        width: 180px;
        text-align: center;
        font-family: "Inter", var(--sans);
        font-size: 62px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-50);
      }
      #alt-num::after {
        content: attr(data-suffix);
        display: block;
        margin-top: 6px;
        font-family: var(--sans);
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--ink-300);
      }
      #s2-copy {
        position: absolute;
        left: 0; top: 76px;
        width: 1920px;
        text-align: center;
        font-size: 104px;
        font-weight: 900;
        line-height: 1.2;
        white-space: nowrap;
      }
      #s2-copy span.beat { display: inline-block; opacity: 0; }

      /* ================= S3 ================= */
      #s3-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 1300px 800px at 50% 50%, #0f1a4f 0%, #070d2b 100%); }
      #viewer {
        position: absolute;
        left: 0; top: 0;
        width: 1920px; height: 1080px;
        transform-origin: 0 0;
        opacity: 0;
      }
      #frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(124, 196, 255, 0.25);
      }
      #v-article { position: absolute; left: 0; top: 0; width: 1540px; height: 1080px; overflow: hidden; background: #fff; }
      #v-strip { position: absolute; left: 0; top: 0; width: 1540px; height: 2160px; }
      #pre-article, #jump-article { position: absolute; left: 0; width: 1540px; height: 1080px; display: block; }
      #pre-article { top: 0; }
      #jump-article { top: 1080px; }
      #v-panel { position: absolute; left: 1540px; top: 0; width: 380px; height: 1080px; overflow: hidden; }
      #pre-panel, #jump-panel { position: absolute; left: 0; top: 0; width: 380px; height: 1080px; display: block; }
      #jump-panel { opacity: 0; }
      #shot-search { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; opacity: 0; }
      .pulse {
        position: absolute;
        opacity: 0;
        border: 4px solid var(--brand-sky);
        border-radius: 10px;
        box-shadow: 0 0 26px rgba(56, 182, 255, 0.85), inset 0 0 14px rgba(56, 182, 255, 0.35);
      }
      #panel-halo {
        position: absolute;
        border: 3.5px solid var(--brand-sky);
        border-radius: 24px;
        box-shadow: 0 0 30px rgba(56, 182, 255, 0.8);
      }
      #flyers { position: absolute; inset: 0; opacity: 0; }
      .flyer {
        position: absolute;
        left: 0; top: 0;
        white-space: nowrap;
        font-weight: 700;
        line-height: 1;
        padding: 0.25em 0.46em;
        border-radius: 0.25em;
        color: var(--ink-50);
        background: var(--sky-900);
        border: 0.05em solid var(--brand-sky);
      }
      #cursor { position: absolute; left: 0; top: 0; width: 84px; height: 112px; opacity: 0; overflow: visible; transform-origin: 0 0; }
      .ripple {
        position: absolute;
        width: 120px; height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        border: 6px solid var(--brand-sky);
        opacity: 0;
      }
      #s3 .pill { opacity: 0; }

      /* ================= S4 ================= */
      #s4-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 1500px 760px at 50% 60%, #0f1a4f 0%, #070d2b 100%); }
      #s4-copy {
        position: absolute;
        left: 0; top: 58px;
        width: 1920px;
        text-align: center;
        font-size: 100px;
        font-weight: 900;
        line-height: 1.2;
        white-space: nowrap;
      }
      #strip-persp {
        position: absolute;
        left: 0; top: 0;
        width: 1920px; height: 1080px;
        perspective: 1900px;
        perspective-origin: 960px 620px;
      }
      #strip {
        position: absolute;
        left: 0; top: 0;
        width: 1920px; height: 1080px;
        transform-style: preserve-3d;
      }
      .card-wrap { position: absolute; top: 260px; height: 720px; }
      .card {
        display: block;
        height: 720px;
        width: auto;
        border-radius: 18px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(124, 196, 255, 0.28);
      }
      .halo {
        position: absolute;
        border: 4px solid var(--brand-sky);
        border-radius: 16px;
        box-shadow: 0 0 34px rgba(56, 182, 255, 0.8);
      }
      .site-tag {
        position: absolute;
        left: 22px; top: 22px;
        padding: 8px 26px;
        border-radius: 999px;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
        color: var(--ink-50);
        background: var(--sky-900);
        border: 2px solid rgba(124, 196, 255, 0.55);
        box-shadow: 0 8px 26px rgba(7, 13, 43, 0.45);
      }
      #zen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; opacity: 0; filter: brightness(1.25); }
      #zen-pill { opacity: 0; font-size: 48px; font-weight: 500; padding: 14px 38px; }

      /* ================= S5 ================= */
      #s5-here {
        position: absolute;
        left: 130px; top: 280px;
        font-size: 216px;
        font-weight: 900;
        line-height: 1.1;
        white-space: nowrap;
        opacity: 0;
      }
      #here-line {
        position: absolute;
        left: 1370px; top: 397px;
        width: 366px; height: 4px;
        opacity: 0;
        transform-origin: 100% 50%;
        background: linear-gradient(90deg, rgba(124, 196, 255, 0), #9fd6ff);
      }
      #lockup-glow {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(ellipse 1080px 520px at 50% 40%, rgba(33, 150, 243, 0.26) 0%, rgba(33, 150, 243, 0) 100%);
      }
      #lockup {
        position: absolute;
        left: 100px; right: 100px; top: 196px; bottom: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
      }
      #brand-row { display: flex; align-items: center; gap: 56px; }
      #brand-icon { display: block; width: 236px; height: auto; }
      #wordmark {
        font-family: "Inter", var(--sans);
        font-size: 196px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--ink-50);
      }
      #tagline { margin-top: 38px; font-size: 64px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-50); }
      #site-url { margin-top: 26px; font-family: "Inter", var(--sans); font-size: 42px; font-weight: 700; color: #7cc4ff; }
      #fine { margin-top: auto; text-align: center; }
      #fine-a { font-size: 32px; font-weight: 500; letter-spacing: 0.03em; color: var(--ink-300); }
      #fine-b { margin-top: 12px; font-size: 28px; font-weight: 500; color: var(--ink-300); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33"
      data-width="1920"
      data-height="1080"
    >
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <filter id="road-grade" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
          <feColorMatrix
            type="matrix"
            values="-0.150 -0.505 -0.051 0 0.76
                    -0.150 -0.505 -0.051 0 0.82
                    -0.100 -0.337 -0.034 0 0.72
                     0 0 0 1 0"
          />
        </filter>
      </svg>

      <!-- =========================================================
           WORLD: article road, sky, eagle (S1, S2, S5)
           ========================================================= -->
      <section id="world" class="scene" data-layout-allow-overflow>
        <img id="sky" src="assets/sky-night.jpg" alt="" />
        <div id="horizon-glow"></div>
        <div id="persp" data-layout-allow-overflow>
          <div id="road" data-layout-allow-overflow style="height: 30630px;">
            <!-- road-slices:start -->
          <img class="slice" src="assets/capture/page-00.jpg" alt="" style="top: 0px; height: 6000px;" />
          <img class="slice" src="assets/capture/page-01.jpg" alt="" style="top: 6000px; height: 6000px;" />
          <img class="slice" src="assets/capture/page-02.jpg" alt="" style="top: 12000px; height: 6000px;" />
          <img class="slice" src="assets/capture/page-03.jpg" alt="" style="top: 18000px; height: 6000px;" />
          <img class="slice" src="assets/capture/page-04.jpg" alt="" style="top: 24000px; height: 6000px;" />
          <img class="slice" src="assets/capture/page-05.jpg" alt="" style="top: 30000px; height: 630px;" />
          <!-- road-slices:end -->
            <div class="edge l"></div>
            <div class="edge r"></div>
            <div id="road-dots"></div>
            <div class="road-fog"></div>
            <div id="road-signs"></div>
          </div>
        </div>
        <div id="dim"></div>
        <div id="eagle-light"></div>
        <div id="eagle-fly" data-layout-allow-overflow>
          <img id="eagle" src="assets/eagle-cutout.png" alt="" data-layout-allow-overflow />
        </div>
      </section>

      <!-- S2 altitude HUD -->
      <div id="hud">
        <div id="hud-ticks" data-layout-allow-overflow></div>
        <div id="hud-needle"></div>
        <div id="alt-num" data-suffix="公尺">3</div>
      </div>

      <!-- S1 / S5 scrollbar -->
      <svg id="scrollbar" viewBox="0 0 1920 1080" aria-hidden="true">
        <g id="track" fill="none" stroke="#b9c7e6" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="track-ticks" stroke="#9fd6ff" stroke-linecap="round"></g>
        <g id="thumb"></g>
      </svg>
      <div id="here-dot"></div>
      <div class="here-ring" id="here-ring-a"></div>
      <div class="here-ring" id="here-ring-b"></div>

      <!-- S1 HOOK -->
      <div id="hook-copy">
        <div id="hook-a">這篇文章，</div>
        <div id="hook-b">你<span class="hl">讀到哪</span>了？</div>
      </div>

      <!-- S2 TWIST -->
      <div id="s2-copy">
        <span class="beat" id="s2-a">不是文章太長，</span><span class="beat" id="s2-b">是你<span class="hl">站得太低</span>。</span>
      </div>

      <!-- =========================================================
           S3 MECHANIC
           ========================================================= -->
      <section id="s3" class="scene" style="opacity: 0; display: none;">
        <div id="s3-bg"></div>
        <div id="viewer" data-layout-allow-overflow>
          <div id="frame">
            <div id="v-article" data-layout-allow-overflow>
              <div id="v-strip" data-layout-allow-overflow>
                <img id="pre-article" src="assets/crops/pre-article.png" alt="" />
                <img id="jump-article" src="assets/crops/jump-article.png" alt="" data-layout-allow-overflow />
              </div>
            </div>
            <div id="v-panel" data-layout-allow-overflow>
              <img id="pre-panel" src="assets/crops/pre-panel.png" alt="" />
              <img id="jump-panel" src="assets/crops/jump-panel.png" alt="" data-layout-allow-overflow />
            </div>
            <img id="shot-search" src="assets/capture/view-search.png" alt="" />
          </div>
          <div id="panel-halo"></div>
          <div class="pulse" id="pulse-row"></div>
          <div class="pulse" id="pulse-head"></div>
        </div>
        <div id="flyers" data-layout-allow-overflow data-layout-allow-overlap></div>
        <div class="ripple" id="ripple-a"></div>
        <div class="ripple" id="ripple-b"></div>
        <svg id="cursor" viewBox="0 0 84 112" aria-hidden="true">
          <path
            d="M2 2 C3 18 2 42 4 74 L21 58 C26 70 33 86 40 98 L58 89 C51 75 44 60 37 49 L62 47 C42 32 22 17 2 2 Z"
            fill="#f2f6ff"
            stroke="#0f1a4f"
            stroke-width="5"
            stroke-linejoin="round"
          />
        </svg>
        <div class="pill" id="pill-a" data-layout-allow-overflow>自動長出目錄。</div>
        <div class="pill" id="pill-b" data-layout-allow-overflow>點一下，<span class="hl">就到了</span>。</div>
        <div class="pill" id="pill-c" data-layout-allow-overflow>記得一個詞，就找得到。</div>
      </section>

      <!-- =========================================================
           S4 RANGE
           ========================================================= -->
      <section id="s4" class="scene" style="opacity: 0; display: none;">
        <div id="s4-bg"></div>
        <div id="s4-copy">有標題的地方，<span class="hl">牠就看得見</span>。</div>
        <div id="strip-persp" data-layout-allow-overflow>
          <div id="strip" data-layout-allow-overflow>
            <div class="card-wrap" data-crop="530,160,1390,720" data-panel="338,741" data-layout-allow-overflow><img class="card" src="assets/crops/card-blog.jpg" alt="" /><div class="site-tag">Huli's blog</div></div>
            <div class="card-wrap" data-crop="560,384,1360,696" data-panel="384,862" data-layout-allow-overflow><img class="card" src="assets/crops/card-mdn.jpg" alt="" /><div class="site-tag">MDN</div></div>
            <div class="card-wrap" data-crop="600,513,1320,567" data-panel="513,862" data-layout-allow-overflow><img class="card" src="assets/crops/card-github.jpg" alt="" /><div class="site-tag">GitHub</div></div>
            <div class="card-wrap" data-crop="470,90,1450,810" data-panel="215,865" data-layout-allow-overflow><img class="card" src="assets/crops/card-dark.jpg" alt="" /><div class="site-tag">Wikipedia · 深色模式</div></div>
          </div>
        </div>
        <img id="zen" src="assets/capture/view-zen.png" alt="" data-layout-allow-overflow />
        <div class="pill" id="zen-pill">想專心時，牠就退開。</div>
      </section>

      <!-- =========================================================

    <script id="manifest-data" type="application/json">{"pageHeight":30630,"pageWidth":1280,"headings":[{"level":2,"text":"詳細定義","y":867},{"level":2,"text":"發展史","y":1685},{"level":2,"text":"研究課題","y":4977},{"level":3,"text":"演繹、推理和解決問題","y":5073},{"level":3,"text":"知識表示法","y":5351},{"level":3,"text":"規劃","y":5787},{"level":3,"text":"機器學習","y":5982},{"level":3,"text":"自然語言處理","y":6252},{"level":3,"text":"運動和控制","y":6402},{"level":3,"text":"機器感知","y":6552},{"level":3,"text":"社交","y":6703},{"level":3,"text":"創造力","y":6879},{"level":2,"text":"研究方法","y":7026},{"level":3,"text":"控制論與大腦類比","y":7283},{"level":3,"text":"符號處理","y":7475},{"level":3,"text":"子符號方法","y":8017},{"level":3,"text":"統計學方法","y":8262},{"level":3,"text":"整合方法","y":8430},{"level":2,"text":"應用","y":8695},{"level":3,"text":"基本應用","y":8825},{"level":3,"text":"實際應用","y":9643},{"level":3,"text":"應用領域","y":10041},{"level":2,"text":"倫理","y":10315},{"level":3,"text":"倫理管理","y":10403},{"level":3,"text":"經濟衝擊","y":10837},{"level":3,"text":"AI對人類的威脅","y":11272},{"level":3,"text":"AI與管理","y":11798},{"level":3,"text":"濫用","y":12049},{"level":3,"text":"監管","y":12277},{"level":2,"text":"學科範疇","y":13052},{"level":3,"text":"涉及學科","y":13147},{"level":3,"text":"研究範疇","y":13389},{"level":2,"text":"哲學","y":13636},{"level":3,"text":"強人工智慧和弱人工智慧","y":13688},{"level":2,"text":"參看","y":15047},{"level":2,"text":"參考文獻","y":15549},{"level":3,"text":"註解","y":15601},{"level":3,"text":"參照","y":16014},{"level":3,"text":"來源","y":26161},{"level":2,"text":"擴充閱讀","y":29509},{"level":2,"text":"外部連結","y":29790}],"jump":{"text":"倫理","y":10315,"panelRow":{"x":1549,"y":545.91,"width":350,"height":31.59}},"panel":{"x":1548,"y":215,"width":352,"height":650},"search":{"query":"應用","results":["應用 H2","基本應用 H3","實際應用 H3","應用領域 H3"]}}</script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = JSON.parse(document.getElementById("manifest-data").textContent);

      /* Road camera. Page point (AX, py) lands on screen (960, ty) on the perspective plane. */
      const PERSPECTIVE = 1500;
      const ORIGIN_Y = 780;
      const AX = 738; /* article column axis in the 1280px page */
      const LEFT_X = 200;
      const RIGHT_X = 1276;
      const CAM_END = { tilt: 74, s: 1.5, ty: 1080, py: 15400 };
      /* The road keeps drifting under the S2 hold and while the signs lift off it. */
      const DRIFT = { from: 8.7, to: 13.55, py: 15600 };
      const SIGN_SWAP = 12.36;
      const driftAt = (t) => gsap.parseEase("sine.out")((t - DRIFT.from) / (DRIFT.to - DRIFT.from));
      const CAM_HOLD = { ...CAM_END, py: CAM_END.py + (DRIFT.py - CAM_END.py) * driftAt(SIGN_SWAP) };
      const HORIZON_Y = ORIGIN_Y - PERSPECTIVE / Math.tan((CAM_END.tilt * Math.PI) / 180);

      function project(pageX, pageY, cam) {
        const rad = (cam.tilt * Math.PI) / 180;
        const v = (cam.py - pageY) * cam.s;
        const k = PERSPECTIVE / (PERSPECTIVE + v * Math.sin(rad));
        return {
          k,
          x: 960 + (pageX - AX) * cam.s * k,
          y: ORIGIN_Y + (cam.ty - v * Math.cos(rad) - ORIGIN_Y) * k,
        };
      }

      /* S3 viewer framing: screen = page * scale + (x, y). */
      const VIEW_FRAMED = { scale: 1760 / 1920, x: 80, y: 45 };
      const row = D.jump.panelRow;
      const HIT = { x: row.x + 49, y: row.y + row.height / 2 }; /* 49px in = the 倫理 glyphs */
      const PUSH_SCALE = 2.5;
      const PUSH_X = 1920 * (1 - PUSH_SCALE);
      const VIEW_PUSH = { scale: PUSH_SCALE, x: PUSH_X, y: 520 - HIT.y * PUSH_SCALE };
      const HIT_SCREEN = {
        x: HIT.x * VIEW_PUSH.scale + VIEW_PUSH.x,
        y: HIT.y * VIEW_PUSH.scale + VIEW_PUSH.y,
      };
      /* Measured from view-jump.png: highlighted row, article heading mark, panel list shift. */
      const JUMP_ROW = { top: 713, bottom: 744.5 };
      const JUMP_HEAD = { left: 486, right: 533.5, top: 20, bottom: 46.5 };
      const PANEL_SHIFT = 167;
      const PANEL_BODY = { top: 268, bottom: 865 };

      /* ---------- Heading dots (real y) ---------- */
      const dots = [];
      const dotHost = document.getElementById("road-dots");
      D.headings.forEach((h) => {
        [LEFT_X + 46, RIGHT_X - 46].forEach((x) => {
          const d = document.createElement("div");
          d.className = "dot";
          d.style.left = x + "px";
          d.style.top = h.y + "px";
          dotHost.appendChild(d);
          dots.push({ el: d, y: h.y });
        });
      });

      /* ---------- Signposts: real h2 text at real y, children of the road ---------- */
      const signHost = document.getElementById("road-signs");
      const flyerHost = document.getElementById("flyers");
      const lastTop = { left: Infinity, right: Infinity };
      const signs = D.headings
        .filter((h) => h.level === 2 && h.y < CAM_END.py)
        .reverse() /* near first */
        .map((h, i) => {
          const side = i % 2 === 0 ? "left" : "right";
          const x = side === "left" ? LEFT_X : RIGHT_X;
          const base = project(x, h.y, CAM_END);
          const font = 24 + 35 * Math.pow(base.k, 0.8); /* 28px at the horizon, about 52px up close */
          const boxH = font * 1.62;
          const bottom = Math.min(base.y - (34 + 64 * base.k), lastTop[side] - 10);
          lastTop[side] = bottom - boxH;
          const pole = base.y - bottom;
          const unit = font / 56; /* screen px per sign-local px */

          const el = document.createElement("div");
          el.className = "sign " + side;
          el.style.left = x + "px";
          el.style.top = h.y + "px";
          el.style.setProperty("--ss", unit / (CAM_END.s * base.k));
          el.style.setProperty("--pole", pole / unit + "px");
          el.innerHTML =
            '<div class="sign-tilt"><div class="sign-body"><div class="pole"></div><div class="sign-label"></div></div></div>';
          el.querySelector(".sign-label").textContent = h.text;
          signHost.appendChild(el);

          /* Screen-space twin for the flight into the panel in S3. */
          const hold = project(x, h.y, CAM_HOLD);
          const r = hold.k / base.k;
          const fontHold = font * r;
          const w = fontHold * (h.text.length + 0.92);
          const f = document.createElement("div");
          f.className = "flyer";
        f.setAttribute("data-layout-ignore", "");
          f.style.fontSize = fontHold + "px";
          f.textContent = h.text;
          flyerHost.appendChild(f);
          return {
            h,
            k: base.k,
            body: el.querySelector(".sign-body"),
            flyer: f,
            from: {
              x: side === "left" ? hold.x - w / 2 : hold.x + w / 2,
              y: hold.y - pole * r - (boxH * r) / 2,
              font: fontHold,
            },
          };
        });

      /* Panel row positions (panel.png rhythm: h2→ 32px, h3→ 29px, first row at 106px). */
      const rowY = new Map();
      D.headings.reduce((y, h, i, all) => {
        rowY.set(h, y);
        const next = all[i + 1];
        return y + (next && next.level === 3 && h.level === 3 ? 29 : 31);
      }, 106);

      /* ---------- Hand-drawn scrollbar ---------- */
      const TRACK = { x: 1826, top: 56, h: 968, w: 46 };
      const THUMB_H = (1080 / D.pageHeight) * TRACK.h; /* the real viewport-to-page ratio */
      const NS = "http://www.w3.org/2000/svg";
      const thumbY = (py) => TRACK.top + TRACK.h * (py / D.pageHeight);

      function sketchCapsule(cx, top, h, w, seed, amp) {
        const r = w / 2;
        const pts = [];
        const n = 48;
        const wob = (t) => Math.sin(t * 19 + seed) * amp * 0.6 + Math.sin(t * 47 + seed * 1.7) * amp * 0.4;
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          pts.push([cx + r + wob(t), top + r + (h - w) * t]);
        }
        for (let i = 0; i <= 10; i++) {
          const a = (Math.PI * i) / 10;
          pts.push([cx + r * Math.cos(a), top + h - r + r * Math.sin(a)]);
        }
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          pts.push([cx - r + wob(t + 3), top + h - r - (h - w) * t]);
        }
        for (let i = 0; i <= 10; i++) {
          const a = Math.PI + (Math.PI * i) / 10;
          pts.push([cx + r * Math.cos(a), top + r + r * Math.sin(a)]);
        }
        return "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
      }
      const svgEl = (tag, attrs) => {
        const e = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
        return e;
      };
      const trackG = document.getElementById("track");
      trackG.appendChild(svgEl("path", { d: sketchCapsule(TRACK.x, TRACK.top, TRACK.h, TRACK.w, 1.3, 2.2), "stroke-width": 4 }));
      trackG.appendChild(svgEl("path", { d: sketchCapsule(TRACK.x, TRACK.top, TRACK.h, TRACK.w, 4.1, 2.8), "stroke-width": 2, opacity: 0.5 }));
      const thumbG = document.getElementById("thumb");
      thumbG.appendChild(
        svgEl("path", {
          d: sketchCapsule(TRACK.x, 0, THUMB_H, TRACK.w - 16, 2.2, 0.8),
          fill: "#38b6ff",
          stroke: "#f2f6ff",
          "stroke-width": 3,
          "stroke-linejoin": "round",
        }),
      );
      const ticksG = document.getElementById("track-ticks");
      D.headings.forEach((h) => {
        const half = h.level === 2 ? 15 : 8;
        const y = thumbY(h.y);
        ticksG.appendChild(
          svgEl("line", { x1: TRACK.x - half, x2: TRACK.x + half, y1: y, y2: y, "stroke-width": h.level === 2 ? 4 : 2.5 }),
        );
      });
      const HERE = { x: TRACK.x - 62, y: thumbY(D.jump.y) + THUMB_H / 2 };
      ["#here-dot", "#here-ring-a", "#here-ring-b"].forEach((sel) => {
        const e = document.querySelector(sel);
        e.style.left = HERE.x + "px";
        e.style.top = HERE.y + "px";
      });

      /* ---------- Pulse boxes in viewer coordinates ---------- */
      const pulseRow = document.getElementById("pulse-row");
      pulseRow.style.cssText += `left:${row.x}px;top:${JUMP_ROW.top - 3}px;width:${row.width}px;height:${JUMP_ROW.bottom - JUMP_ROW.top + 6}px;`;
      const pulseHead = document.getElementById("pulse-head");
      pulseHead.style.cssText += `left:${JUMP_HEAD.left - 12}px;top:${JUMP_HEAD.top - 8}px;width:${JUMP_HEAD.right - JUMP_HEAD.left + 24}px;height:${JUMP_HEAD.bottom - JUMP_HEAD.top + 16}px;`;

      ["ripple-a", "ripple-b"].forEach((id) => {
        const e = document.getElementById(id);
        e.style.left = HIT_SCREEN.x + "px";
        e.style.top = HIT_SCREEN.y + "px";
      });

      /* ---------- S4 halos: outline the real panel inside each cropped card ---------- */
      const CARD_H = 720;
      const PANEL_X = { left: D.panel.x, right: D.panel.x + D.panel.width };
      document.querySelectorAll(".card-wrap").forEach((wrap) => {
        const [cx, cy, cw, ch] = wrap.dataset.crop.split(",").map(Number);
        const [top, bottom] = wrap.dataset.panel.split(",").map(Number);
        const r = CARD_H / ch;
        const halo = document.createElement("div");
        halo.className = "halo";
        halo.style.cssText = `left:${(PANEL_X.left - cx) * r}px;top:${(top - cy) * r}px;width:${(PANEL_X.right - PANEL_X.left) * r}px;height:${(bottom - top) * r}px;`;
        wrap.style.width = cw * r + "px";
        wrap.style.left = 960 - (cw * r) / 2 + "px";
        wrap.appendChild(halo);
      });

      /* ==========================================
         S1 HOOK (0 - 5.2s)
         ========================================== */
      const scrollFlick = (py, at, duration) => {
        tl.to("#road", { "--py": py, duration, ease: "power2.out" }, at);
        tl.to("#thumb", { y: thumbY(py), duration, ease: "power2.out" }, at);
      };
      tl.set("#road", { "--tilt": 0, "--s": 3.2, "--py": 240, "--ty": 540 }, 0);
      tl.set("#thumb", { y: thumbY(240) }, 0);
      tl.to("#scrollbar", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
      scrollFlick(1500, 0.1, 1.3);
      scrollFlick(3100, 1.6, 1.4);
      scrollFlick(4600, 3.2, 1.5);

      tl.fromTo("#hook-a", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3);
      tl.fromTo("#hook-b", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.75);
      tl.to("#hook-copy", { opacity: 0, y: -46, duration: 0.45, ease: "power2.in" }, 4.72);
      tl.to("#scrollbar", { opacity: 0, duration: 0.45, ease: "power1.in" }, 4.8);
      tl.set("#hook-copy", { display: "none" }, 5.25);
      tl.set("#scrollbar", { display: "none" }, 5.3);

      /* ==========================================
         S2 TWIST (5.2 - 12.4s): the camera climbs; same element, same shot as S1
         ========================================== */
      const RISE = 4.95;
      const RISE_D = 3.75;
      tl.to(
        "#road",
        { "--tilt": CAM_END.tilt, "--s": CAM_END.s, "--ty": CAM_END.ty, "--py": CAM_END.py, duration: RISE_D, ease: "power2.inOut" },
        RISE,
      );
      tl.to("#road", { "--py": DRIFT.py, duration: DRIFT.to - DRIFT.from, ease: "sine.out" }, DRIFT.from);

      tl.to("#dim", { opacity: 0, duration: 2.5, ease: "power1.inOut" }, RISE + 0.7);
      tl.to("#sky", { opacity: 1, duration: 1.7, ease: "power1.inOut" }, RISE + 1.5);
      tl.to("#horizon-glow", { opacity: 1, duration: 1.7, ease: "power1.inOut" }, RISE + 1.8);
      tl.to(".road-fog", { opacity: 1, duration: 1.9, ease: "power1.inOut" }, RISE + 1.3);
      tl.to(".edge", { opacity: 0.85, duration: 1.5, ease: "power1.inOut" }, RISE + 1.6);

      /* Altimeter is bound to the same seconds as the climb. */
      const altitude = { p: 0 };
      const altNum = document.getElementById("alt-num");
      const hudTicks = document.getElementById("hud-ticks");
      tl.to("#hud", { opacity: 1, duration: 0.5, ease: "power1.out" }, RISE + 0.32);
      tl.to(
        altitude,
        {
          p: 1,
          duration: RISE_D,
          ease: "power2.inOut",
          onUpdate() {
            const v = Math.round(3 * Math.pow(1000, altitude.p));
            altNum.firstChild.nodeValue = v.toLocaleString("en-US");
            hudTicks.style.transform = `translateY(${altitude.p * 3000}px)`;
          },
        },
        RISE,
      );

      /* The eagle: y and scale share one ease, so it stays on the perspective line to the
         vanishing point. The ease is constant-acceleration flight in world distance. */
      const FLY = 5.95;
      const FLY_D = 3.75;
      const Q0 = 2.2;
      const Q1 = 0.012;
      const FLY_POW = 3.1;
      const flightQ = (p) => 1 / (1 / Q0 + (1 / Q1 - 1 / Q0) * Math.pow(p, FLY_POW));
      const flightEase = (p) => (flightQ(p) - Q0) / (Q1 - Q0);
      const flightP = (q) => Math.pow((1 / q - 1 / Q0) / (1 / Q1 - 1 / Q0), 1 / FLY_POW);
      const eagleY = (q) => HORIZON_Y + q * 620;
      const lightY = (q) => HORIZON_Y + q * 730;
      tl.set("#eagle-fly", { opacity: 1, y: eagleY(Q0), scale: Q0 * 1.05 }, FLY - 0.01);
      tl.to("#eagle-fly", { y: eagleY(Q1), scale: Q1 * 1.05, duration: FLY_D, ease: flightEase }, FLY);
      tl.to("#eagle-fly", { opacity: 0, duration: 0.5, ease: "power1.in" }, FLY + FLY_D - 0.5);
      tl.fromTo("#eagle", { x: -120, rotation: -5, scaleY: 0.86 }, { x: 150, rotation: 4, scaleY: 0.82, duration: 1.5, ease: "sine.inOut" }, FLY);
      tl.to("#eagle", { x: -60, rotation: -2, scaleY: 0.86, duration: 1.3, ease: "sine.inOut" }, FLY + 1.5);
      tl.to("#eagle", { x: 0, rotation: 0, duration: 0.95, ease: "sine.inOut" }, FLY + 2.8);
      tl.set("#eagle-light", { y: lightY(Q0), scale: Q0, opacity: 0 }, FLY - 0.01);
      tl.to("#eagle-light", { y: lightY(Q1), scale: Q1, duration: FLY_D, ease: flightEase }, FLY);
      tl.to("#eagle-light", { opacity: 1, duration: 0.8, ease: "power1.out" }, FLY + 0.5);
      tl.to("#eagle-light", { opacity: 0, duration: 0.6, ease: "power1.in" }, FLY + FLY_D - 0.6);

      /* Signs and dots light up as the eagle reaches them, near to far. */
      const LIT_FROM = 7.55;
      const LIT_TO = FLY + FLY_D - 0.05;
      const litAt = (k) => {
        const p0 = flightP(signs[0].k);
        return LIT_FROM + ((flightP(k) - p0) / (1 - p0)) * (LIT_TO - LIT_FROM);
      };
      signs.forEach((s) => {
        tl.fromTo(s.body, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.2)" }, litAt(s.k));
      });
      dots.forEach((d) => {
        if (d.y > CAM_HOLD.py + 900) return;
        const k = Math.min(project(LEFT_X, d.y, CAM_END).k, signs[0].k);
        tl.to(d.el, { opacity: 1, duration: 0.3, ease: "power1.out" }, litAt(k));
      });

      tl.fromTo("#s2-a", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.75);
      tl.fromTo("#s2-b", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.85);

      /* ==========================================
         S3 MECHANIC (12.4 - 20.4s)
         ========================================== */
      tl.to("#s2-copy", { opacity: 0, duration: 0.3, ease: "power1.in" }, 12.2);
      tl.to("#hud", { opacity: 0, duration: 0.3, ease: "power1.in" }, 12.2);
      tl.set("#s2-copy", { display: "none" }, 12.55);
      tl.set("#hud", { display: "none" }, 12.55);

      tl.set("#s3", { display: "block" }, 12.3);
      tl.to("#s3", { opacity: 1, duration: 0.01 }, 12.32);
      tl.set("#s3-bg", { opacity: 0 }, 12.3);

      /* The road stays up while the signs lift off it; the night only goes once they are under way. */
      tl.set(".sign-label", { opacity: 0 }, SIGN_SWAP);
      tl.to(".pole", { opacity: 0, duration: 0.25, ease: "power1.in" }, SIGN_SWAP);
      tl.set("#flyers", { opacity: 1 }, SIGN_SWAP);
      tl.to("#s3-bg", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 13.12);
      tl.set("#world", { display: "none" }, 13.54);

      /* The panel that flies in IS the screenshot's panel: #frame is clipped to it, then the clip
         opens onto the page, so nothing cross-fades. Brightness climbs over the same move. */
      const panelRect = D.panel;
      const panelClip = `inset(${panelRect.y}px ${1920 - panelRect.x - panelRect.width}px ${1080 - panelRect.y - panelRect.height}px ${panelRect.x}px round 24px)`;
      const halo = document.getElementById("panel-halo");
      halo.style.cssText = `left:${panelRect.x}px;top:${panelRect.y}px;width:${panelRect.width}px;height:${panelRect.height}px;`;
      tl.set("#viewer", { ...VIEW_FRAMED, x: VIEW_FRAMED.x + 460, opacity: 0 }, 12.3);
      tl.set("#frame", { clipPath: panelClip, filter: "brightness(0.36)" }, 12.3);
      tl.to("#viewer", { x: VIEW_FRAMED.x, opacity: 1, duration: 0.55, ease: "power3.out" }, 12.42);
      tl.to("#frame", { clipPath: "inset(0px 0px 0px 0px round 20px)", duration: 0.5, ease: "power2.inOut" }, 13.2);
      tl.set("#frame", { clipPath: "none" }, 13.72);
      tl.to("#frame", { filter: "brightness(1)", duration: 0.9, ease: "sine.inOut" }, 13.42);
      tl.set("#frame", { filter: "none" }, 14.34);

      /* Signs land on their own rows in the page panel; rows scrolled out of it stop at its edge. */
      const VS = VIEW_FRAMED.scale;
      const jumpHeading = D.headings.find((h) => h.y === D.jump.y);
      const PANEL_TEXT_X = 1584; /* measured: h2 text left edge in view-prejump.png */
      const PANEL_FONT = 14.4; /* measured: panel h2 glyph advance */
      signs.forEach((s, i) => {
        const f = s.flyer;
        const row = HIT.y + rowY.get(s.h) - rowY.get(jumpHeading);
        const rowCenter = gsap.utils.clamp(PANEL_BODY.top + 14, PANEL_BODY.bottom - 14, row);
        const at = 12.42 + i * 0.03;
        tl.set(f, { xPercent: -50, yPercent: -50, x: s.from.x, y: s.from.y, scale: 1, opacity: 1 }, SIGN_SWAP);
        tl.to(
          f,
          {
            x: VIEW_FRAMED.x + (PANEL_TEXT_X + (PANEL_FONT * s.h.text.length) / 2) * VS,
            y: VIEW_FRAMED.y + rowCenter * VS,
            duration: 0.78,
            ease: "power2.inOut",
          },
          at,
        );
        /* Full size for most of the flight; only the last stretch shrinks to row size. */
        tl.to(f, { scale: (PANEL_FONT * VS) / s.from.font, duration: 0.26, ease: "power1.in" }, at + 0.52);
        tl.to(f, { opacity: 0, duration: 0.16, ease: "power1.in" }, at + 0.64);
      });
      tl.set("#flyers", { display: "none" }, 13.5);

      tl.fromTo("#pill-a", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 13.85);

      /* Push in on the panel, cursor lands on the 倫理 row. */
      const CLICK = 15.75;
      tl.to("#viewer", { ...VIEW_PUSH, duration: 1.05, ease: "power2.inOut" }, 14.55);
      tl.set("#cursor", { x: 760, y: 1150, opacity: 1 }, 14.75);
      tl.to("#cursor", { x: HIT_SCREEN.x, duration: 0.95, ease: "power2.inOut" }, 14.75);
      tl.to("#cursor", { y: HIT_SCREEN.y, duration: 0.95, ease: "power3.out" }, 14.75);
      tl.to("#cursor", { scale: 0.86, duration: 0.09, ease: "power1.in" }, CLICK - 0.05);
      tl.to("#cursor", { scale: 1, duration: 0.14, ease: "power1.out" }, CLICK + 0.05);
      tl.fromTo("#ripple-a", { opacity: 0.95, scale: 0.15 }, { opacity: 0, scale: 2.1, duration: 0.6, ease: "power2.out", immediateRender: false }, CLICK);
      tl.fromTo("#ripple-b", { opacity: 0.8, scale: 0.15 }, { opacity: 0, scale: 3, duration: 0.75, ease: "power2.out", immediateRender: false }, CLICK + 0.1);

      /* The page really jumps: the article column slides, the panel stays put and its list follows. */
      const JUMP = CLICK + 0.1;
      const clip = (d) => `inset(${PANEL_BODY.top - d}px 0px ${1080 - PANEL_BODY.bottom + d}px 0px)`;
      tl.to("#v-strip", { y: -1080, duration: 0.66, ease: "power3.inOut" }, JUMP);
      tl.set("#jump-panel", { opacity: 1, y: -PANEL_SHIFT, clipPath: clip(-PANEL_SHIFT) }, JUMP - 0.08);
      const LIST_SLIDE = { at: JUMP + 0.05, duration: 0.6 };
      const PULL_BACK = { at: JUMP + 0.12, duration: 0.85 };
      tl.to("#jump-panel", { y: 0, clipPath: clip(0), duration: LIST_SLIDE.duration, ease: "power2.inOut" }, LIST_SLIDE.at);
      tl.set("#jump-panel", { clipPath: "inset(0px 0px 0px 0px)" }, JUMP + 0.7);
      tl.to("#viewer", { ...VIEW_FRAMED, duration: PULL_BACK.duration, ease: "power2.inOut" }, PULL_BACK.at);

      /* The cursor stays on the 倫理 row while the list slides and the camera pulls back. Row y on
         screen is (list offset x scale + camera y), a product of two tweens, so its exact curve
         becomes the cursor's ease. x only depends on the camera and can share its ease. */
      const inOut = gsap.parseEase("power2.inOut");
      const progress = (t, span) => inOut(gsap.utils.clamp(0, 1, (t - span.at) / span.duration));
      const rowScreenY = (t) => {
        const e = progress(t, PULL_BACK);
        const scale = gsap.utils.interpolate(VIEW_PUSH.scale, VIEW_FRAMED.scale, e);
        const cameraY = gsap.utils.interpolate(VIEW_PUSH.y, VIEW_FRAMED.y, e);
        return (HIT.y + PANEL_SHIFT * progress(t, LIST_SLIDE)) * scale + cameraY;
      };
      const rideEnd = PULL_BACK.at + PULL_BACK.duration;
      const rideDuration = rideEnd - LIST_SLIDE.at;
      const rideFrom = rowScreenY(LIST_SLIDE.at);
      const rideTo = rowScreenY(rideEnd);
      tl.to("#cursor", { x: HIT.x * VS + VIEW_FRAMED.x, duration: PULL_BACK.duration, ease: "power2.inOut" }, PULL_BACK.at);
      tl.to(
        "#cursor",
        {
          y: rideTo,
          duration: rideDuration,
          ease: (p) => (rowScreenY(LIST_SLIDE.at + p * rideDuration) - rideFrom) / (rideTo - rideFrom),
        },
        LIST_SLIDE.at,
      );
      tl.to("#cursor", { opacity: 0, duration: 0.3, ease: "power1.in" }, JUMP + 1.2);

      tl.to("#pill-a", { opacity: 0, y: -18, duration: 0.25, ease: "power1.in" }, JUMP + 0.1);
      tl.fromTo("#pill-b", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, JUMP + 0.45);
      tl.fromTo("#pulse-row", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, JUMP + 0.95);
      tl.fromTo("#pulse-head", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, JUMP + 0.95);
      tl.to(".pulse", { opacity: 0.35, duration: 0.5, ease: "sine.inOut" }, JUMP + 1.45);
      tl.to(".pulse", { opacity: 1, duration: 0.5, ease: "sine.inOut" }, JUMP + 1.95);

      /* Last 1.6s: real search for 應用. */
      const SEARCH = 18.35;
      const SEARCH_SCALE = 1.46;
      const SEARCH_VIEW = { scale: SEARCH_SCALE, x: 1920 * (1 - SEARCH_SCALE), y: -104 };
      tl.set(".pulse, #panel-halo", { opacity: 0 }, SEARCH - 0.01);
      tl.set("#shot-search", { opacity: 1 }, SEARCH);
      tl.set("#viewer", { scale: SEARCH_SCALE - 0.05, x: 1920 * (1 - SEARCH_SCALE + 0.05), y: -60 }, SEARCH);
      tl.to("#viewer", { ...SEARCH_VIEW, duration: 1.8, ease: "sine.out" }, SEARCH);
      tl.set("#pill-b", { opacity: 0 }, SEARCH);
      tl.fromTo("#pill-c", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, SEARCH + 0.08);

      tl.to("#s3", { opacity: 0, duration: 0.28, ease: "power1.in" }, 20.2);
      tl.set("#s3", { display: "none" }, 20.5);

      /* ==========================================
         S4 RANGE (20.4 - 26.4s)
         ========================================== */
      tl.set("#s4", { display: "block" }, 20.3);
      tl.to("#s4", { opacity: 1, duration: 0.4, ease: "power1.out" }, 20.4);
      tl.fromTo("#s4-copy", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 20.65);
      /* One site at a time: the main card is flat and complete, its neighbours wait in depth. */
      const CARD_STEP = 1290;
      const CARD_DEPTH = 420;
      const CARD_TILT = 24;
      const CARD_MOVES = [20.85, 21.9, 22.95];
      const coverState = (offset) => ({
        x: offset * CARD_STEP,
        z: -Math.min(Math.abs(offset), 2) * CARD_DEPTH,
        rotationY: -Math.sign(offset) * CARD_TILT,
      });
      gsap.utils.toArray(".card-wrap").forEach((card, i) => {
        tl.set(card, coverState(i), 20.3);
        CARD_MOVES.forEach((at, m) => {
          tl.to(card, { ...coverState(i - m - 1), duration: 0.38, ease: "power2.inOut" }, at);
        });
      });
      tl.fromTo("#strip", { x: 36 }, { x: -36, duration: 3.6, ease: "none" }, 20.3);
      tl.to(["#s4-copy", "#strip-persp"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 23.8);
      tl.to("#s4-bg", { opacity: 0, duration: 0.3, ease: "power1.in" }, 23.8);
      tl.fromTo("#zen", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power1.out" }, 23.95);
      tl.to("#zen", { scale: 1.03, duration: 1.7, ease: "none" }, 24.65);
      tl.fromTo("#zen-pill", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 24.05);
      tl.to("#s4", { opacity: 0, duration: 0.35, ease: "power1.in" }, 26.15);
      tl.set("#s4", { display: "none" }, 26.55);

      /* ==========================================
         S5 HEART (26.4 - 32.5s): back to S1's framing, now you know where you are
         ========================================== */
      const SETTLE = 26.3;
      tl.set("#world", { display: "block", opacity: 1 }, SETTLE);
      tl.set("#road", { "--tilt": 0, "--s": 3.2, "--ty": 540, "--ax": 523, "--py": D.jump.y - 700 }, SETTLE);
      tl.set(".road-fog, .edge, .dot", { opacity: 0 }, SETTLE);
      tl.set("#sky, #horizon-glow", { opacity: 0 }, SETTLE);
      tl.set("#dim", { opacity: 0.84 }, SETTLE);
      tl.set("#scrollbar", { display: "block", opacity: 0 }, SETTLE);
      tl.set("#thumb", { y: thumbY(D.jump.y - 700) }, SETTLE);
      tl.to("#scrollbar", { opacity: 1, duration: 0.35, ease: "power1.out" }, SETTLE + 0.1);
      tl.to("#track-ticks", { opacity: 1, duration: 0.6, ease: "power1.out" }, SETTLE + 0.25);
      tl.to("#road", { "--py": D.jump.y + 130, duration: 0.85, ease: "power3.out" }, SETTLE + 0.1); /* 倫理 sits near the top of frame */
      tl.to("#thumb", { y: thumbY(D.jump.y), duration: 0.85, ease: "power3.out" }, SETTLE + 0.1);

      tl.set("#s5", { display: "block", opacity: 1 }, SETTLE);
      const HERE_AT = 26.6;
      tl.fromTo("#here-dot", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, HERE_AT);
      tl.fromTo("#here-ring-a", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 3.6, duration: 1.1, ease: "power2.out", immediateRender: false }, HERE_AT + 0.1);
      tl.fromTo("#here-ring-b", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 3.6, duration: 1.1, ease: "power2.out", immediateRender: false }, HERE_AT + 0.75);
      tl.fromTo("#s5-here", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, HERE_AT + 0.1);
      tl.fromTo("#here-line", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, HERE_AT + 0.25);

      const LOCK = 28.95;
      tl.to("#s5-here", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, LOCK - 0.25);
      tl.to(["#scrollbar", "#here-dot", "#here-line"], { opacity: 0, duration: 0.4, ease: "power1.in" }, LOCK - 0.25);
      tl.to("#dim", { opacity: 1, duration: 0.5, ease: "power1.inOut" }, LOCK - 0.25);
      tl.set("#s5-here", { display: "none" }, LOCK + 0.2);
      tl.set("#scrollbar", { display: "none" }, LOCK + 0.2);
      tl.set("#world", { display: "none" }, LOCK + 0.35);
      tl.to("#lockup", { opacity: 1, duration: 0.3, ease: "power1.out" }, LOCK);
      tl.to("#lockup-glow", { opacity: 1, duration: 0.9, ease: "power1.out" }, LOCK);
      tl.fromTo("#brand-row", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, LOCK);
      tl.fromTo("#tagline", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, LOCK + 0.5);
      tl.fromTo("#site-url", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, LOCK + 0.8);
      tl.fromTo("#fine", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, LOCK);

      tl.to({}, { duration: 0.01 }, 32.99);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
